---
# User-defined dict
grafana: {}
# Internal dict to merge with user one
grafana_data:
  # Host dir to store grafana data
  admin_user: admin
  admin_password: password
  # Docker labels
  docker_labels: []

grafana_docker_image: "grafana/grafana"
grafana_port: "3000"
grafana_container_port: "3000"
grafana_ports:
  - "{{ grafana_port }}:{{ grafana_container_port }}"
grafana_storage: /var/grafana/storage
grafana_provisioning_dir: /var/grafana/provisioning
grafana_config_ini_directory: /var/grafana

# GitSync and Provisioning Settings
grafana_cleanup_old_provisioning: true
grafana_gitsync_enabled: true

# Source Repository with dashboards
grafana_dashboards_repo_url: "https://github.com/oom-ag/grafana-dashboards.git"
grafana_dashboards_repo_version: "main"
grafana_gitsync_token: "{{ vault_grafana_dashboards_repo_token }}"

# Explicit list of dashboards to deploy on this specific host/group.
# Examples: 
# grafana_sync_dashboards:
#   - "alertmanager"
#   - "apt-monitoring"
#   - "backup-reporter-dashboard"
#   - "blockchain-nodes-mainnet"
#   - "cadvisor-dashboard"
#   - "chrony"
#   - "common-hosts-info"
#   - "django-metrics"
#   - "embily_dashboard"
#   - "grafana-metrics"
#   - "haproxy-common"
#   - "haproxy-nalitek"
#   - "hosts-availability-v2"
#   - "mtproxy-sessions"
#   - "mysql-overview"
#   - "nginx-dashboard"
#   - "node-exporter-for-victoriametrics-dashboard"
#   - "node-exporter-summary"
#   - "nodejs-application-dashboard"
#   - "nodes-usage"
#   - "overall-hosts-availability"
#   - "pingstation"
#   - "postgresql-exporter"
#   - "postgresql-overview"
#   - "postgresql-patroni"
#   - "redis-dashboard-for-prometheus-redis-exporter"
#   - "statushost-dashboard"
#   - "sync-status"
#   - "traefik-dashboard"
#   - "varnish"
#   - "versions"
#   - "victoriametrics"
#   - "victoriametrics-summary"
#   - "vmagent"
#   - "vmalert"
#   - "xray-logs-data"
#   - "xray-vpn-servers"

grafana_sync_dashboards: []

grafana_ldap_host_config_path: /var/grafana/config
grafana_volumes:
  - "{{ grafana_storage }}:/var/lib/grafana"
  - "{{ grafana_config_ini_directory }}/grafana.ini:/etc/grafana/grafana.ini"
  - "{{ grafana_provisioning_dir }}:/etc/grafana/provisioning"
  - "{{ grafana_ldap_host_config_path }}:{{ grafana_ldap_config_path }}"
grafana_external_volumes: {}

# Docker-related networking settings
grafana_docker_network_name: prom_network
grafana_container_networks:
  default:
    name: "{{ grafana_docker_network_name }}"
    external: true

grafana_container_name: "grafana"
grafana_docker_hostname: "grafana"

grafana_user_list: []
  # - name: "Mrs. X"
  #   email: "x@gmail.com"
  #   password: "passwordX"

grafana_url: "http://127.0.0.1:{{ grafana_port }}"
grafana_datasources:
  - name: Prometheus
    url: http://victoriametrics:8428
    type: prometheus
    access: proxy
    isDefault: true

grafana_ldap_auth_enabled: false
grafana_ldap_root: "dc=example,dc=com"
grafana_ldap_config_path: /etc/grafana/config
grafana_ldap_allow_sign_up: true
grafana_ldap_servers:
  - host: ldap01.example.com # required
    port: 389
    use_ssl: "false"
    start_tls: "false"
    ssl_skip_verify: "false"
    bind_dn: "cn=reader,{{ grafana_ldap_root }}"
    bind_password: "grafana"
    timeout: "10"
    search_filter: "(&(uid=%s)(objectClass=posixAccount)"
    search_base_dns: "ou=users,{{ grafana_ldap_root }}"
    attributes:
      name: "givenName"
      surname: "sn"
      username: "cn"
      member_of: "memberOf"
      email: "mail"
    # The first group mapping will be used
    # https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/configure-authentication/ldap/#group-mappings
    group_mappings:
      - group_dn: "cn=grafana.superadmins,ou=groups,{{ grafana_ldap_root }}"
        org_role: "Admin"
        org_id: "1"
        grafana_admin: true
      - group_dn: "cn=grafana.viewers,ou=groups,{{ grafana_ldap_root }}"
        org_role: "Viewer"

grafana_stack_name: victoriametrics
grafana_swarm_cluster: false
grafana_swarm_deploy:
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.labels.victoriametrics == true

# example grafana_swarm_deploy:
#   mode: replicated
#   replicas: 1
#   update_config:
#     order: start-first
#   placement:
#     max_replicas_per_node: 1
#     constraints:
#       - node.labels.victoriametrics == true
#   resources:
#     limits:
#       memory: 512M
#     reservations:
#       memory: 256M

# renderer options
grafana_setup_renderer: false
grafana_renderer_image: grafana/grafana-image-renderer:3.11.6
grafana_renderer_hostname: grafana-renderer
grafana_renderer_ports: 8081
# Place your grafana token here
# Refer to docs for more information:
# https://grafana.com/docs/grafana-cloud/account-management/authentication-and-permissions/access-policies/authorize-services/
grafana_renderer_token: None
grafana_renderer_config_dir: /var/grafana/renderer
grafana_renderer_memory_limit: 8g
grafana_renderer_cpu_limit: "4.0"

# metrics options
grafana_metrics: false

# custom config
# example:
# [auth.generic_oauth]
# enabled = true
# name = Keycloak-OAuth
# allow_sign_up = true
# this section will simply be added to grafana.ini configuration
grafana_custom_config: |
  [server]
  read_timeout = 0

  [dataproxy]
  timeout = 300

grafana_loki_install: false
grafana_loki_image: "grafana/loki:3.1.1"
grafana_loki_storage: /var/loki/
grafana_loki_directory_owner: 10001
grafana_loki_directory_group: 10001
grafana_loki_docker_labels: []

grafana_loki_config:

  auth_enabled: false

  server:
    http_listen_port: 3100
    http_server_write_timeout: 190s
    http_server_read_timeout: 190s

  querier:
    max_concurrent: 12 

  common:
    path_prefix: /loki
    storage:
      filesystem:
        chunks_directory: /var/lib/loki/data/chunks
        rules_directory: /var/lib/loki/data/rules
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory

  schema_config:
    configs:
      - from: 2020-10-24
        store: boltdb-shipper
        object_store: filesystem
        schema: v11
        index:
          prefix: index_
          period: 24h
      - from: 2025-01-11
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  storage_config:
    tsdb_shipper:
      active_index_directory: /var/lib/loki/data/tsdb-index
      cache_location: /var/lib/loki/tsdb-cache

  ruler:
    alertmanager_url: http://localhost:9093

  limits_config:
    allow_structured_metadata: false
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    retention_period: 30d
    split_queries_by_interval: 15m
    query_timeout: 180s
    max_query_parallelism: 12

  compactor:
    working_directory: /var/lib/loki/data/retention
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: filesystem
